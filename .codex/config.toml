# Canonical Codex configuration — authored, shareable subset.
# Source of truth: SharedVSCode .ai/config/codex/config.toml
# Rendered by .ai/tools/Render-AIAdapters.ps1 to each repo's .codex/config.toml (the project layer,
# which Codex loads only for TRUSTED projects). The global ~/.codex/config.toml is managed separately
# by .ai/tools/Update-CodexGlobalConfig.ps1 (managed merge: these authored keys + the preserved
# [projects] trust table).
#
# Intentionally EXCLUDED (machine/session/runtime-managed by the Codex desktop app):
#   marketplaces, plugins, node_repl, the computer-use notify command, per-project trust.
# MCP servers are intentionally NOT declared here yet — they will be scoped to specific subagents once
# the canonical subagent/orchestration set is authored. Codex auto-discovers agents from
# .codex/agents/*.toml and skills from .agents/skills/*/SKILL.md by folder, so no discovery markers
# are needed.

model = "gpt-5.5"
model_reasoning_effort = "xhigh"
service_tier = "default"

[windows]
sandbox = "elevated"

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_SHELL = "pwsh"
