<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1205px" preserveAspectRatio="none" style="width:429px;height:1205px;background:#FFFFFF;" version="1.1" viewBox="0 0 429 1205" width="429px" zoomAndPan="magnify"><title>RPRRSBSI-V4 Layered Specification and Quality Promotion</title><defs/><g><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="386.75" x="20" y="35.1074">RPRRSBSI-V4 Layered Specification and Quality Promotion</text><ellipse cx="214.875" cy="59.6211" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F0F4FF" height="33.3008" rx="12.5" ry="12.5" style="stroke:#3366CC;stroke-width:0.5;" width="215.9473" x="106.9014" y="89.6211"/><text fill="#000000" font-family="Segoe UI" font-size="10" lengthAdjust="spacing" textLength="195.9473" x="116.9014" y="110.4121">Layer 0 - characterize and freeze V3 baseline</text><rect fill="#F0F4FF" height="33.3008" rx="12.5" ry="12.5" style="stroke:#3366CC;stroke-width:0.5;" width="191.3623" x="119.1938" y="142.9219"/><text fill="#000000" font-family="Segoe UI" font-size="10" lengthAdjust="spacing" textLength="171.3623" x="129.1938" y="163.7129">Layer 1 - catalogs, Entity, ExpertSystem</text><rect fill="#F0F4FF" height="33.3008" rx="12.5" ry="12.5" style="stroke:#3366CC;stroke-width:0.5;" width="193.5547" x="118.0977" y="196.2227"/><text fill="#000000" font-family="Segoe UI" font-size="10" lengthAdjust="spacing" textLength="173.5547" x="128.0977" y="217.0137">Layer 2 - variants, occurrences, overlays</text><rect fill="#F0F4FF" height="33.3008" rx="12.5" ry="12.5" style="stroke:#3366CC;stroke-width:0.5;" width="250.4199" x="89.665" y="249.5234"/><text fill="#000000" font-family="Segoe UI" font-size="10" lengthAdjust="spacing" textLength="230.4199" x="99.665" y="270.3145">Layer 3 - typed I/O, workflow and calculation graphs</text><rect fill="#F0F4FF" height="33.3008" rx="12.5" ry="12.5" style="stroke:#3366CC;stroke-width:0.5;" width="236.2012" x="96.7744" y="302.8242"/><text fill="#000000" font-family="Segoe UI" font-size="10" lengthAdjust="spacing" textLength="216.2012" x="106.7744" y="323.6152">Layer 4 - Tags expert system and reference seeds</text><rect fill="#F0F4FF" height="33.3008" rx="12.5" ry="12.5" style="stroke:#3366CC;stroke-width:0.5;" width="230.6299" x="99.5601" y="356.125"/><text fill="#000000" font-family="Segoe UI" font-size="10" lengthAdjust="spacing" textLength="210.6299" x="109.5601" y="376.916">Layer 5 - computer-configuration expert system</text><rect fill="#F0F4FF" height="33.3008" rx="12.5" ry="12.5" style="stroke:#3366CC;stroke-width:0.5;" width="264.7754" x="82.4873" y="409.4258"/><text fill="#000000" font-family="Segoe UI" font-size="10" lengthAdjust="spacing" textLength="244.7754" x="92.4873" y="430.2168">Layer 6 - ACE edit sessions and compound instantiation</text><rect fill="#F0F4FF" height="33.3008" rx="12.5" ry="12.5" style="stroke:#3366CC;stroke-width:0.5;" width="244.8535" x="92.4482" y="462.7266"/><text fill="#000000" font-family="Segoe UI" font-size="10" lengthAdjust="spacing" textLength="224.8535" x="102.4482" y="483.5176">Layer 7 - manifestation plan, approval, run contract</text><rect fill="#F0F4FF" height="33.3008" rx="12.5" ry="12.5" style="stroke:#3366CC;stroke-width:0.5;" width="215.3271" x="107.2114" y="516.0273"/><text fill="#000000" font-family="Segoe UI" font-size="10" lengthAdjust="spacing" textLength="195.3271" x="117.2114" y="536.8184">Layer 8 - backup, cloud, retention hardening</text><rect fill="none" height="291.8047" style="stroke:#000000;stroke-width:1.5;" width="279.6826" x="75.0337" y="559.3281"/><path d="M149.3501,559.3281 L149.3501,565.6289 L139.3501,575.6289 L75.0337,575.6289" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Segoe UI" font-size="10" lengthAdjust="spacing" textLength="64.3164" x="78.0337" y="571.1191">For every layer</text><rect fill="#F0F4FF" height="33.3008" rx="12.5" ry="12.5" style="stroke:#3366CC;stroke-width:0.5;" width="175.4834" x="127.1333" y="592.6289"/><text fill="#000000" font-family="Segoe UI" font-size="10" lengthAdjust="spacing" textLength="155.4834" x="137.1333" y="613.4199">Add forward-only Flyway migration</text><rect fill="#F0F4FF" height="33.3008" rx="12.5" ry="12.5" style="stroke:#3366CC;stroke-width:0.5;" width="228.1543" x="100.7979" y="645.9297"/><text fill="#000000" font-family="Segoe UI" font-size="10" lengthAdjust="spacing" textLength="208.1543" x="110.7979" y="666.7207">Add deterministic CSV seeds and loader checks</text><rect fill="#F0F4FF" height="33.3008" rx="12.5" ry="12.5" style="stroke:#3366CC;stroke-width:0.5;" width="174.165" x="127.7925" y="699.2305"/><text fill="#000000" font-family="Segoe UI" font-size="10" lengthAdjust="spacing" textLength="154.165" x="137.7925" y="720.0215">Run static and fresh-database tests</text><rect fill="#F0F4FF" height="33.3008" rx="12.5" ry="12.5" style="stroke:#3366CC;stroke-width:0.5;" width="259.6826" x="85.0337" y="752.5313"/><text fill="#000000" font-family="Segoe UI" font-size="10" lengthAdjust="spacing" textLength="239.6826" x="95.0337" y="773.3223">Upgrade a V3-shaped database and run negative tests</text><rect fill="#F0F4FF" height="33.3008" rx="12.5" ry="12.5" style="stroke:#3366CC;stroke-width:0.5;" width="128.75" x="150.5" y="805.832"/><text fill="#000000" font-family="Segoe UI" font-size="10" lengthAdjust="spacing" textLength="108.75" x="160.5" y="826.623">Run semantic/as-of tests</text><rect fill="none" height="291.8047" style="stroke:#000000;stroke-width:1.5;" width="245.0635" x="92.3433" y="861.1328"/><path d="M183.4565,861.1328 L183.4565,867.4336 L173.4565,877.4336 L92.3433,877.4336" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Segoe UI" font-size="10" lengthAdjust="spacing" textLength="81.1133" x="95.3433" y="872.9238">Quali