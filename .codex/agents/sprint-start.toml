## Step 3c: Materialize per-repo AI instruction files and AIAdapter surfaces

`New-SprintStage2` performs the per-repo instruction distribution immediately
after it creates and verifies `OverviewSprint<NNNN>.code-workspace`. Do not
invoke the individual lane builders. Verify the aggregate returned by Stage 2:

```powershell
$aiInstructions = $stage2.infrastructure.aiInstructions
$aiInstructions | ConvertTo-Json -Depth 5

if ($stage2.infrastructure.aiInstructionsError -or -not $aiInstructions.Success) {
    Write-PSFMessage -Level Error -Message (
        "AI instruction distribution failed: " +
        $stage2.infrastructure.aiInstructionsError +
        " $($aiInstructions.Errors -join '; ')"
    )
    return
}
```

`New-SprintStage2` also calls `Initialize-SprintAIAdapters`, which delegates to
`Invoke-SprintAIAdapterLifecycle -Boundary Start` for the registry-owned
AIAdapter domains:

```text
instructions,settings,permissions,hooks,toolsets
```

Because Stage 2 treats downstream adapter materialization warnings as non-fatal,
run an explicit idempotent lifecycle verification pass after Stage 2 succeeds.
This pass is the SprintStart gate for native Claude Code, Codex, and Antigravity
agent adapters plus settings, permissions, hooks, and toolsets. GitHub Copilot
does not currently have a native per-agent adapter target; it consumes the
Copilot instruction surfaces generated by the instruction adapter.

```powershell
$createdWorktrees = @(
    $stage1.sharedVSCode.worktreePath
    $stage1.planning.worktreePath
    $stage2.repoResults |
        Where-Object { -not $_.error -and $_.worktreePath } |
        ForEach-Object { $_.worktreePath }
) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique

foreach ($worktreePath in $createdWorktrees) {
    $adapterLifecycle = Invoke-SprintAIAdapterLifecycle `
        -Boundary Start `
        -TargetRoot $worktreePath `
        -SharedVSCodeWorktreePath $stage1.sharedVSCode.worktreePath `
        -Confirm:$false

    $adapterErrors = @($adapterLifecycle.Results | Where-Object Action -eq 'error')
    if ($adapterErrors.Count -gt 0) {
        Write-PSFMessage -Level Error -Message (
            "AIAdapter lifecycle materialization failed for $worktreePath: " +
            (($adapterErrors | ForEach-Object { "$($_.Path): $($_.Message)" }) -join '; ')
        )
        return
    }
}
```

`Build-AIInstructionsPerRepository` parses the workspace once, computes the
stable-worktree skip boundary once, runs the three existing lane builders in
canonical order, and aggregates per-lane plus per-repository results:

1. `Build-CLAUDEPerRepository` — `CLAUDE.md` = `ai-local.md` + `CLAUDE-base.md` (Claude).
2. `Build-AGENTSPerRepository` — `AGENTS.md` = `ai-local.md` (AI-LOCAL block) + `AGENTS-base.md`
   (AI-CORE block); the shared core read by Codex, Antigravity (Gemini), and GitHub Copilot.
3. `Build-AgentSpecificPerRepository` — distributes `GEMINI.md` and
   `.github/copilot-instructions.md` (per-agent deltas only — **never** the core body).

The shared repository context ensures stable-only repositories are skipped
consistently across every lane. Compare-before-write behavior makes a second
orchestrator run a no-op.

**Verify (no-double-core invariant):** a second call must report all `unchanged`, and the
drift audit must find no `double-core` rows — the core body appears exactly once in each
caller's load set (`AGENTS.md` for Codex/Antigravity/Copilot, `CLAUDE.md` for Claude):

```powershell
# $sharedRoot = the SharedVSCode sprint worktree root
. "$sharedRoot\.ai\tools\Test-AIAdapterDrift.ps1"
@((Test-AIAdapterDrift -Domain instructions).Results | Where-Object State -eq 'double-core').Count  # must be 0
```

