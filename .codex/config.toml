# Codex adapter pilot configuration
# Sprint 0008 Task 8.20D
#
# Codex discovers custom agents from .codex/agents/*.toml and skills from
# .agents/skills/*/SKILL.md. This config is intentionally declarative-only for
# the pilot so it remains valid TOML without relying on an unstable local schema.

[pilot]
source_manifest = "SharedVSCode/.ai/manifests/instruction-map.json"
custom_agents = [".codex/agents/version-control-commit.toml"]
skills = [".agents/skills/git-commit/SKILL.md", ".agents/skills/powershell/SKILL.md", ".agents/skills/html-board-extraction/SKILL.md"]

# BEGIN ATAP AI SETTINGS (managed)
# Task 10.20 reviewed project-scope Codex settings.
# Global-only model, service tier, desktop, plugin, marketplace, trust, notify,
# Windows sandbox, and MCP sections are intentionally excluded.

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_SHELL = "pwsh"
# END ATAP AI SETTINGS (managed)
