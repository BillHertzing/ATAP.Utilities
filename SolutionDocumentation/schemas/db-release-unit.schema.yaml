{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://atap.example.com/schemas/db-release-unit/v1.json",
  "title": "ATAP DB release unit manifest",
  "description": "Schema for db/<App>/releases/<x.y.z>.yml files that declare a database change unit.",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "appVersion",
    "dbChangeUnit",
    "flywayTargetVersion",
    "migrations",
    "repeatables",
    "seedFiles",
    "seedLoaders",
    "expectedRowCounts",
    "notes"
  ],
  "properties": {
    "appVersion": {
      "$ref": "#/$defs/semVerString",
      "description": "Application version associated with this DB change unit."
    },
    "dbChangeUnit": {
      "$ref": "#/$defs/nonEmptyString",
      "description": "Stable identity for the DB change unit."
    },
    "flywayTargetVersion": {
      "$ref": "#/$defs/flywayVersion",
      "description": "Flyway schema version reached after applying this change unit."
    },
    "migrations": {
      "type": "array",
      "uniqueItems": true,
      "items": {
        "$ref": "#/$defs/migrationFileName"
      },
      "description": "Versioned Flyway migration SQL files included in the change unit."
    },
    "repeatables": {
      "type": "array",
      "uniqueItems": true,
      "items": {
        "$ref": "#/$defs/repeatableFileName"
      },
      "description": "Repeatable Flyway SQL files included in the change unit."
    },
    "seedFiles": {
      "type": "array",
      "uniqueItems": true,
      "items": {
        "$ref": "#/$defs/seedCsvFileName"
      },
      "description": "CSV seed files included in the change unit."
    },
    "seedLoaders": {
      "type": "array",
      "uniqueItems": true,
      "items": {
        "$ref": "#/$defs/seedLoaderFileName"
      },
      "description": "SQL or PowerShell scripts that load seed files."
    },
    "expectedRowCounts": {
      "type": "object",
      "propertyNames": {
        "$ref": "#/$defs/nonEmptyString"
      },
      "additionalProperties": {
        "type": "integer",
        "minimum": 0
      },
      "description": "Expected table row counts after loading seed data."
    },
    "notes": {
      "$ref": "#/$defs/nonEmptyString",
      "description": "Operational notes for the change unit."
    }
  },
  "$defs": {
    "nonEmptyString": {
      "type": "string",
      "minLength": 1
    },
    "semVerString": {
      "type": "string",
      "pattern": "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$"
    },
    "flywayVersion": {
      "type": "string",
      "pattern": "^[0-9]+(?:\\.[0-9]+)*$"
    },
    "migrationFileName": {
      "type": "string",
      "pattern": "^V[0-9]+(?:\\.[0-9]+)*__[^\\\\/]+\\.sql$"
    },
    "repeatableFileName": {
      "type": "string",
      "pattern": "^R__[^\\\\/]+\\.sql$"
    },
    "seedCsvFileName": {
      "type": "string",
      "pattern": "^(?!.*[\\\\/]).+\\.csv$"
    },
    "seedLoaderFileName": {
      "type": "string",
      "pattern": "^(?!.*[\\\\/]).+\\.(?:sql|ps1)$"
    }
  }
}
