  "vscodeOpened": <boolean>,
  "junctionsStatus": "ok" | "skipped" | "error",
  "error": "<string | null>"
}
```

## Skill Reference

Execute every step in [`.claude/skills/issue-to-worktree/SKILL.md`](../skills/issue-to-worktree/SKILL.md)
exactly as written. The steps are reproduced below with their required tool mappings.

## Step 0: Preconditions

Run via `terminal`:

```powershell
git status
git rev-parse --show-toplevel
git remote -v
```

If any command fails, return:

```json
{
  "workflow": "issue-to-worktree",
  "error": "Not a git repository or no remote configured."
}
```

## Step 1: Gather Issue Details (Interactive)

Ask the user:

> "Please describe the problem, desired behavior, acceptance criteria, and any
> links/logs. Include constraints (e.g., .NET version, OS, perf)."

**Do not proceed until the user responds.**

## Step 2: Generate Plan

From the issue title (inferred from user context) and the gathered details,
produce a markdown plan covering:

- Files/components likely to change
- Tests to add/update
- Rollback considerations
- Definition of done checklist

## Step 3: Create GitHub Issue

Compose issue body:

```markdown
## User input

<verbatim user input>

## Plan

<generated plan>

## Definition of done

- [ ] <item>
```

Use the `github` MCP tool (`mcp_github_issue_write`) to create the issue.
Capture `issueNumber` and `issueUrl` from the response.

## Step 4: Fetch Latest Main

Run via `terminal`:

```powershell
git fetch origin main
```

## Step 5: Create Worktree

Run via `terminal`:

```powershell
$repoRoot        = git rev-parse --show-toplevel
$repoParent      = Split-Path $repoRoot -Parent
$repoName        = Split-Path $repoRoot -Leaf
$kebabShortTitle = (<first 6 words of issue title, lowercased and hyphenated>)
$branchName      = "<issueNumber>-${kebabShortTitle}"
$worktreePath    = Join-Path $repoParent "${repoName}-wt-<issueNumber>-${kebabShortTitle}"

git worktree add -b $branchName $worktreePath main
```

## Step 6: Replicate Junctions

**Skip this step if `$repoName` is `SharedVSCode`.** SharedVSCode is the source of
junctions for all other repos and must not have junctions itself.

**Junction target strategy:**

- **Sprint worktrees** (branch name includes `sprint-NNNN`): junctions must point to the
  SharedVSCode **sprint** worktree (e.g., `SharedVSCode-wt-36-sprint-0004-work-items`),
  not the main worktree. Use `-DevSourceRepoPath` for this.
- **Normal issue worktrees**: junctions point to the SharedVSCode **main** worktree
  (default behavior — just copy targets from the source repo).

Ask the user:
> "Does this worktree need junctions to point to a specific SharedVSCode sprint worktree
> (e.g., for sprint branches where `.claude` / `.github` / `.vscode` should come from
> the sprint instead of main)? If so, provide the full path to the SharedVSCode sprint
> worktree."

**For sprint worktrees** (user provides ShareVSCode sprint worktree path):

```powershell
Set-WorktreeJunctions `
  -SourceRepoPath $repoRoot `
  -WorktreePath $worktreePath `
  -DevSourceRepoPath '<SharedVSCode sprint worktree path>' `
  -DevSourceRepoFolderNames @('.claude', '.github', '.vscode')
```

**For normal issue worktrees** (no dev source override):

```powershell
Set-WorktreeJunctions -SourceRepoPath $repoRoot -WorktreePath $worktreePath
```

Set `junctionsStatus`:

- `"ok"` — command succeeded (exit code 0)
- `"skipped"` — `Set-WorktreeJunctions` not found on PATH, or repo is `SharedVSCode`
- `"error"` — command failed

**Junction safety reminder:** When this worktree is later removed, always run
`Remove-Item -LiteralPath $junctionPath` (NO `-Recurse`) for each junction BEFORE calling
`git worktree remove`. Never remove a parent folder with `-Recurse` while junctions exist
inside it.

## Step 6a: Apply SharedVSCode Context

**Never directly edit `.git/config`, `.gitattributes`, `.gitconfig.shared`, or
`core.hooksPath`.** All Git plumbing mutations flow through the SharedVSCode
PowerShell module.

Run via `terminal`:

```powershell
. 'C:\Dropbox\whertzing\GitHub\SharedVSCode\Powershell\Import-SharedVSCodeFunctions.ps1'

$workspaceFiles = @(Get-ChildItem -Path $worktreePath -Filter '*.code-workspace' |
    Select-Object -ExpandProperty FullName)
```

If no `.code-workspace` file exists, set `sharedVSCodeContextStatus = "skipped"` and
warn the user.

Ask the user whether this is normal product work or SharedVSCode validation work.

**Normal product work (default):**

```powershell
Set-DownstreamSharedVSCodeContext -WorkspaceFiles $workspaceFiles
```

**SharedVSCode validation work** (user provides the sprint worktree name):

```powershell
Initialize-DownstreamSprintFromSharedVSCode `
  -WorkspaceFiles $workspaceFiles `
  -TemplateRef '<SharedVSCode sprint worktree name>' `
  -Profile 'sprint-NNNN'
```

Verify with:

```powershell
Get-SharedVSCodeContext -WorkspaceFiles $workspaceFiles
```

## Step 7: Open VS Code on Worktree

Open VS Code **after** junctions and SharedVSCode context are fully applied.

Run via `terminal`:

```powershell
$workspaceFile = Get-ChildItem -Path $worktreePath -Filter "*.code-workspace" `
    | Select-Object -First 1
if ($workspaceFile) {
    code --reuse-window $workspaceFile.FullName
} else {
    code --reuse-window $worktreePath
}
```

Set `vscodeOpened = true` if the command exits without error.

## Step 8: Return Result

Emit the structured return object. Do not add prose after the JSON block.

## Guardrails

- Only use `terminal` for git/PowerShell commands and `github` MCP for issue creation.
- Do not edit any source files.
- Do not create branches or worktrees on any remote other than `origin`.
- Branch base is always `main`; never branch from a feature branch.
- **Never hand-edit** `.git/config`, `.gitattributes`, `.gitconfig.shared`, or
