# Flyway is invoked by the powershell script Invoke-Flyway.ps1, which sets environment variables for all the placeholders
# Every Flyway.toml is unique to a specific databaseName
# All these flyway.toml files are mostly the same
[flyway]
# Shared (baseline) configuration
# --- Safety
cleanDisabled = true
# --- Idempotence
# (Not required, but recommended defaults)
outOfOrder = false
validateOnMigrate = true
validateMigrationNaming = true
# --- Where to put the history table (default schema dbo)
#schemas = "dbo"

# ToDo move this to a placeholder?
# We want to look in the location at which flyway starts for './sql'
#  We also want to look in a common location ('ATAP.Utilities.Databasemanagement/Common/SQL')
#  The location to which that package has been installed
#  So we  want a placeholder here, which is replaced by the location to which Common/SQl has been installed
# --- Locations for SQL migrations
locations = [
  "filesystem:./sql",
  "filesystem:C:\\Dropbox\\whertzing\\GitHub\\ATAP.Utilities\\src\\ATAP.Utilities.DatabaseManagement\\SharedSQL"]


[flyway.placeholders]
data_dir       = ".\\DATA"
#  -- placeholders for manifest. Actual values at runtime will be placed in Env variables or command line overrides
PackageName    = "BuildSets.Functions"
PackageVersion = "0.0.00001"
GitTag         = "v0.0.00001"
GitCommit      = "abcdef1"
ManifestValues = "(N'V00.01.000010__Init.sql','V',N'4d2...'),(N'R__Permissions.sql','R',N'9ab...')"

# Authentication and TLS flags will be provided by the environment:
#   FLYWAY_INTEGRATED=true|false
#   FLYWAY_DB_USER=...
#   FLYWAY_DB_PASSWORD=...
#   FLYWAY_ENCRYPT=true|false
#   FLYWAY_TRUSTSERVERCERT=true|false

[environments.production]
# UTAT022\Production instance
url  = "jdbc:sqlserver://UTAT022;instanceName=Production;databaseName=BuildSets;integratedSecurity=${FLYWAY_INTEGRATED};encrypt=${FLYWAY_ENCRYPT};trustServerCertificate=${FLYWAY_TRUSTSERVERCERT};"
user = "${FLYWAY_DB_USER}"
password = "${FLYWAY_DB_PASSWORD}"

[environments.testing]
# NCAT016\Testing instance
url  = "jdbc:sqlserver://NCAT016;instanceName=Testing;databaseName=BuildSets;integratedSecurity=${FLYWAY_INTEGRATED};encrypt=${FLYWAY_ENCRYPT};trustServerCertificate=${FLYWAY_TRUSTSERVERCERT};"
user = "${FLYWAY_DB_USER}"
password = "${FLYWAY_DB_PASSWORD}"

[environments.development]
# UTAT022\Development instance
url  = "jdbc:sqlserver://UTAT022;instanceName=Development;databaseName=BuildSets;integratedSecurity=${FLYWAY_INTEGRATED};encrypt=${FLYWAY_ENCRYPT};trustServerCertificate=${FLYWAY_TRUSTSERVERCERT};"
user = "${FLYWAY_DB_USER}"
password = "${FLYWAY_DB_PASSWORD}"

[environments.experimental]
# UTAT022\Testing used for Experimental in your current file; adjust host/instance as needed
url  = "jdbc:sqlserver://UTAT022;instanceName=Testing;databaseName=BuildSets;integratedSecurity=${FLYWAY_INTEGRATED};encrypt=${FLYWAY_ENCRYPT};trustServerCertificate=${FLYWAY_TRUSTSERVERCERT};"
user = "${FLYWAY_DB_USER}"
password = "${FLYWAY_DB_PASSWORD}"
